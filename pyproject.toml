[project]
name = "sortflow"
version = "1.0.0"
description = "Just make it convenient and organize it!"
readme = "README.md"
authors = [
    { name = "Migelitz", email = "macalla.chyrusmiguel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "watchdog>=6.0.0",
]

[project.scripts]
sortflow = "sortflow.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

