[project]
name = "sortflow"
version = "1.0.0"
description = "Just make it convenient and organize it!"
readme = "README.md"
authors = [
    { name = "Migelitz", email = "macalla.chyrusmiguel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "watchdog>=6.0.0",
]

[project.scripts]
sortflow = "sortflow.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = ["E501"]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

